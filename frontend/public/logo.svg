<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="400" height="150">
  <defs>
    <linearGradient id="blipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background (Optional, using transparent here but providing a subtle backdrop hint if needed) -->
  <rect width="100%" height="100%" fill="transparent" />

  <!-- Abstract Radar/Pulse Icon -->
  <g transform="translate(50, 35)">
    <!-- Outer ripples -->
    <circle cx="40" cy="40" r="32" fill="none" stroke="url(#blipGrad)" stroke-width="2" opacity="0.3" />
    <circle cx="40" cy="40" r="20" fill="none" stroke="url(#blipGrad)" stroke-width="3" opacity="0.6" />
    <circle cx="40" cy="40" r="10" fill="url(#blipGrad)" />

    <!-- Pulse trajectory/Data stream -->
    <path d="M 40 40 L 75 5 M 40 40 L 65 65" stroke="url(#blipGrad)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9" />
    <circle cx="75" cy="5" r="4" fill="#ec4899" filter="url(#glow)" />
    <circle cx="65" cy="65" r="3" fill="#3b82f6" filter="url(#glow)" />
  </g>

  <!-- Typography -->
  <text x="150" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="68" fill="url(#blipGrad)" letter-spacing="-3">
    blip
  </text>
</svg>
